# SPDX-License-Identifier: Apache-2.0

description: Marvell 88E1510 Gigabit Ethernet PHY

compatible: "marvell,88e1510"

include:
  - name: ethernet-phy-common.yaml
  - name: ethernet-phy-reset-gpios.yaml

on-bus: mdio

properties:
  no-reset:
    type: boolean
    description: Do not reset the PHY during initialization

  int-gpios:
    type: phandle-array
    description: |
      GPIO connected to the LED[2]/INTn pin of the PHY, active low. When present, the driver
      routes INTn to that pin and enables the auto-negotiation complete, link, speed and duplex
      change interrupts to react to link changes without waiting for the next poll. The periodic
      poll stays active as a fallback. LED[2] is then not available as a LED.

  led0-function-select:
    type: string
    default: "link-activity"
    description: LED0 Function Select
    enum:
      - "#0"
      - "#1"
      - "link-speed"
      - "#3"
      - "link-activity"

  led1-function-select:
    type: string
    default: "link-speed"
    description: LED1 Function Select
    enum:
      - "#0"
      - "#1"
      - "#2"
      - "#3"
      - "link-activity"
      - "#5"
      - "link-speed"

  default-speeds:
    default:
      - "1000BASE Full-Duplex"
      - "100BASE Full-Duplex"
      - "10BASE Full-Duplex"
