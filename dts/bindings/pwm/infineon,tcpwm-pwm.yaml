description: Infineon TCPWM PWM

compatible: "infineon,tcpwm-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml, "infineon,system-interrupts.yaml"]

properties:
  "#pwm-cells":
    const: 3
    description: |
      Number of items to expect in a PWM
      - channel of the timer used for PWM (not used)
      - period to set in ns
      - flags: standard flags like PWM_POLARITY_NORMAL

  pinctrl-0:
    description: |
      PORT pin configuration for the PWM signal.
      We expect that the phandles will reference pinctrl nodes. These
      nodes will have a nodelabel that matches the Infineon SoC Pinctrl
      defines and have following
      format: p<port>_<pin>_<peripheral inst>_<signal>.

      Examples:
        pinctrl-0 = <&p1_1_pwm0_0>;
    required: true

  pinctrl-names:
    required: true

  capture-input:
    type: boolean
    description: |
      Configure this instance as a PWM input-capture channel instead of an
      output. The TCPWM block is initialized as a free-running up-counter
      with independent rising-edge (CC0) and falling-edge (CC1) capture on
      the pinctrl-selected input pin, both routed via CY_TCPWM_INPUT_TRIG_0
      (the instance's own dedicated capture trigger). Requires
      CONFIG_PWM_CAPTURE. set_cycles()/get_cycles_per_sec() output-mode
      calls are rejected (-ENOTSUP) on a capture-mode instance.

  trigmux-in:
    type: int
    description: |
      Required alongside capture-input. Trigger-mux input selector (e.g.
      PERI_0_TRIG_IN_MUX_x_..._TR_OUTn from the SoC's generated trigger
      table) that the pinctrl-selected pin's HSIOM function feeds into.
      Connected to trigmux-out via Cy_TrigMux_Connect() at init.

  trigmux-out:
    type: int
    description: |
      Required alongside capture-input. Trigger-mux output selector (e.g.
      PERI_0_TRIG_OUT_MUX_x_TCPWM0_..._TR_INn) that feeds this instance's
      CY_TCPWM_INPUT_TRIG_0 capture input. Connected to trigmux-in via
      Cy_TrigMux_Connect() at init.

pwm-cells:
  - channel
  - period
  - flags
