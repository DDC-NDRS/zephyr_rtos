description: Infineon CAT1 SDHC/SDIO controller

compatible: "infineon,sdhc-sdio"

include: [sdhc.yaml, pinctrl-device.yaml, "infineon,system-interrupts.yaml"]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  interrupts:
    description: Required for non-cat1c devices

  system-interrupts:
    description: Required for cat1c devices

  bus-width:
    type: int
    default: 4
    description: |
      bus width for SDMMC access, defaults to the minimum necessary
      number of bus lines
    enum:
      - 1
      - 4
      - 8

  no-1-8-v:
    type: boolean
    description: |
      The SD/MMC bus on the board doesn't support the 1.8V voltage,
      Which disables UHS-I, HS200 and HS400 support.

  no-3-3-v:
    type: boolean
    description: |
      When the bus I/O voltage is hard-wired to 1.8V and the board does
      not support 3.3V signaling, add this property to disable 3.3V card
      voltage of the controller. This makes the SD subsystem start the
      card initialization at 1.8V instead of 3.3V.

  cd-gpios:
    type: phandle-array
    description: Card Detect pin

  clk-dst:
    type: int
    description: Peripheral clock destination ID for this TCPWM instance
